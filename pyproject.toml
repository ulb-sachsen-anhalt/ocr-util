[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "ocr_util.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocr_util = ["corpus/*.xml"]

[project]
name = "ocr-util"
dynamic = ["version"]
description = "OCR Utils"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Universitäts- und Landesbibliothek Sachsen-Anhalt",email = "development@bibliothek.uni-halle.de"}]
classifiers = [
    "Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License"
]
dependencies = [
	"rapidfuzz>3",
    "nltk",
    "requests",
    "docker",
    "numpy",
    "shapely",
    "lxml",
    "opencv-python-headless",
    "exifread",
    "Pillow"
]

[project.optional-dependencies]
dev = [
    "black",
    "pylint",
]
test = [
    "pytest-cov",
    "pytest-xdist",
    "flake8",
    "lxml-stubs",
]

[project.urls]
Homepage = "https://github.com/ulb-sachsen-anhalt/ocr-util"

[project.scripts]
ocr = "ocr_util.cli:start"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.pylint.main]
extension-pkg-allow-list=["lxml.etree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ocr_util"]
omit = ["*/tests/*", "*/__pycache__/*", "*/venv/*", "*/build/*"]
report = "xml"

[tool.coverage.report]
precision = 2
